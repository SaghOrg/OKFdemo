# Machine-readable role declaration, so an agent can answer "am I the
# merge-in-charge?" from the repository rather than from its prompt.
#
# The git history of this file is the formal record of who held the role and
# when. Handover is a pull request to this file, approved by the outgoing
# holder -- which is what makes the record trustworthy rather than merely
# present.

merge_authority:
  primary: Anuraag-Tripathi
  deputy: null            # none held; see the limitation below

steward: shsagnik

effective_from: 2026-08-26

# SCOPED TEST, not a permanent handover. Merge authority moves to
# Anuraag-Tripathi for the queue test, and shsagnik holds none -- not as deputy
# either. `steward` deliberately does not move: protocol ownership and merge
# authority are different roles, and only the second one is being exercised
# here. Reverting is a pull request to this file, like any other change to it.

# LIMITATION, recorded here as well as in _plan/prototype-log.md because this file is
# the one an agent reads.
#
# Review is possible: two people have write access and CODEOWNERS names both, so
# either can approve the other's work. Merge authority is a separate question,
# and it now rests with one person and no deputy.
#
# Still outstanding, and sharpened by that. A single named merge authority with
# no deputy is a single point of failure by declaration: if the primary is
# unavailable, nothing should merge, and there is nobody the protocol permits to
# step in. Note also what this file cannot do -- shsagnik remains the repository
# owner and sole admin, so the platform will let him merge whatever he likes
# regardless of what is written here. This declaration is a statement of intent,
# not a control, and on this plan nothing makes it one.
#
# The client repository must be in an organisation: ownership as a team
# reference rather than named individuals, a second admin, and a ruleset that
# makes the declaration binding instead of advisory.
