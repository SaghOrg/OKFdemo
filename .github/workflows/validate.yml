# The same checks the hooks run locally, run again where a reviewer can see them.
#
# A hook is fast feedback for the person writing. It proves nothing to anyone
# else: a reviewer reading a pull request cannot tell whether the author's hook
# ran, was skipped with --no-verify, was never enabled because core.hooksPath is
# opt-in, or was skipped silently because the file lost its executable bit.
# This job is the only check whose result a second person can see.
#
# Every step calls a script under tools/. No check is reimplemented in YAML --
# two implementations drift, and the drift is silent because both sides keep
# passing.

name: validate

on:
  pull_request:
  workflow_dispatch:

# Least privilege. This job reads the tree and reports; it needs nothing else.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Pinned, not ubuntu-latest: a runner image that moves under us changes what
    # the checks ran on without anything in this file changing.
    runs-on: ubuntu-24.04

    strategy:
      # Every version reports. One failing leg should not hide the others --
      # knowing it breaks on the floor but passes on current is the useful
      # result, and fail-fast would throw that away.
      fail-fast: false
      matrix:
        # The floor validate.py declares, the version shipped as
        # /usr/bin/python3 on the authors' machines, the previous single pin,
        # and a current release. The stdlib-only constraint is what makes this
        # transplantable to a locked-down client machine; an untested floor is
        # a claim, not a fact.
        python: ['3.8', '3.9', '3.11', '3.13']

    name: checks (python ${{ matrix.python }})

    steps:
      - name: Check out the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Full history: --diff compares against the merge base, which a
          # shallow clone does not have.
          fetch-depth: 0

      - name: Pin the interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Record what we are running on
        shell: bash
        run: |
          set -euo pipefail
          python3 -VV
          echo "runner: ${ImageOS:-unknown}"

      # --- the two things CI can assert and a hook cannot ------------------
      - name: Hooks are present and would arrive executable
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_hooks.py

      # --- the same checks the hooks run ----------------------------------
      - name: Schema conformance
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate.py

      - name: Source resolution
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_sources.py

      - name: Link resolution
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_links.py

      # Supersession target existence and the cross-field invariant from step 6
      # are the same script: one script per invariant family, so adding a rule
      # does not add a job step.
      - name: Supersession integrity
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_supersession.py

      - name: Credentials across the diff
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            python3 tools/check_secrets.py --diff "$BASE_SHA"
          else
            # Manual run with no pull request to scope against. Scanning
            # everything is the fail-closed choice: narrower would mean
            # scanning nothing.
            python3 tools/check_secrets.py --all
          fi

      - name: Test suite
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_validate.py
